# Builds and pushes qwen3-8-flash-next-ultrafast (ghcr.io/aatind/qwen38-flash-dgx)
# with its scripts/build-and-push.sh. Manual only (Actions > Run workflow):
# the build pulls a ~10 GB vLLM image. The other images here are built
# locally; this one runs in CI because it needs an arm64 machine with
# ~50 GB of disk, which this public repo gets for free.
# Pushes with the run's GITHUB_TOKEN, no registry secret needed. After the
# first push, make the package public (package settings) if it isn't, so
# the DGX Sparks can pull it without credentials.
name: qwen3-8-flash-next-ultrafast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and scan, don't push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h / "$RUNNER_TEMP"
      # Pinned release binary + its published SHA-256 (from the release's
      # trivy_<version>_checksums.txt). Old Trivy releases get removed from
      # GitHub: if this 404s, pin a newer release and its checksum.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/$tarball" -C /usr/local/bin trivy
          trivy --version
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, scan, push
        run: |
          args=(--work-dir "$RUNNER_TEMP")
          if [ "${{ inputs.dry_run }}" = true ]; then args+=(--dry-run); fi
          bash qwen3-8-flash-next-ultrafast/scripts/build-and-push.sh "${args[@]}"
      - name: Disk after build
        if: always()
        run: df -h /
