contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - bash
    - openssh-client
    - sshpass
    - iputils
    - socat
    - ca-certificates-bundle

archs:
  - x86_64
  - aarch64

accounts:
  groups:
    - groupname: ops
      gid: 10001
  users:
    - username: ops
      uid: 10001
      gid: 10001
  run-as: ops

work-dir: /home/ops

entrypoint:
  command: /bin/bash
